<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Pins on Left -->
  <rect x="4" y="14" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="4" y="24" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="4" y="34" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="4" y="44" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <!-- Pins on Right -->
  <rect x="52" y="14" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="52" y="24" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="52" y="34" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <rect x="52" y="44" width="8" height="4" rx="1" fill="url(#pinGrad)" />
  <!-- DIP IC Body -->
  <rect x="10" y="8" width="44" height="48" rx="4" fill="url(#chipGrad)" stroke="#334155" stroke-width="1.5" />
  <!-- IC Orientation Notch -->
  <path d="M 28 8 A 4 4 0 0 0 36 8 Z" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <!-- Pin 1 Dot Indicator -->
  <circle cx="16" cy="16" r="2" fill="#ef4444" />
  <!-- Logic Gate / Circuit Core Symbol -->
  <path d="M 22 24 L 32 24 C 38 24 42 28 42 32 C 42 36 38 40 32 40 L 22 40 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="43" cy="32" r="1.5" fill="#facc15" />
</svg>
